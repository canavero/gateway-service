apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-configmap
data:
  REDIS_HOST: redis
  RATE_LIMIT_REPLENISH: "50"
  RATE_LIMIT_BURST: "100"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      enableServiceLinks: false # sem isso o k8s injeta REDIS_PORT=tcp://<ip>:6379 (Service "redis") e quebra o Spring
      containers:
        - name: gateway
          image: DOCKERHUB_USER/gateway-service:latest
          imagePullPolicy: IfNotPresent # CI faz deploy com tag imutável :<sha>; evita o limite de pulls do Docker Hub
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: gateway-configmap
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /gateway/actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 36 # até 3 min para a JVM subir
          livenessProbe:
            httpGet:
              path: /gateway/actuator/health/liveness
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /gateway/actuator/health/readiness
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - name: http
      port: 80 # http://gateway/info (busybox do enunciado) e http://<elb>/info
      targetPort: 8080
    - name: http-8080
      port: 8080 # http://<elb>:8080/info (hands-on 5)
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
