name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Configuração (Settings > Secrets and variables > Actions):
#   variables: DOCKERHUB_USERNAME, EKS_CLUSTER (ex.: eks-store), AWS_REGION (padrão us-east-2)
#   secrets:   DOCKERHUB_TOKEN, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN (opcional)
# Sem as variáveis, só o job de build/teste roda; os outros ficam "skipped".
env:
  SERVICE: gateway
  IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/gateway-service

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Test & package
        run: ./mvnw -B --no-transfer-progress verify
      - uses: actions/upload-artifact@v7
        with:
          name: jar
          path: target/*.jar

  image:
    name: Docker Hub (build, push, scan)
    needs: build
    if: github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: jar
          path: target
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push (linux/amd64 para o EKS, linux/arm64 para Mac/Graviton)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
      # bottleneck: vulnerability scanning (relatório; não bloqueia o pipeline)
      - name: Trivy (HIGH/CRITICAL)
        run: >
          docker run --rm -v "$HOME/.docker/config.json:/root/.docker/config.json:ro"
          aquasec/trivy:latest image --no-progress --severity HIGH,CRITICAL --exit-code 0
          "$IMAGE:${{ github.sha }}"

  deploy:
    name: Deploy EKS
    needs: image
    if: github.ref == 'refs/heads/main' && vars.EKS_CLUSTER != ''
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
    steps:
      - name: Rolling update
        run: |
          [ -n "$AWS_SESSION_TOKEN" ] || unset AWS_SESSION_TOKEN
          aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER }}
          kubectl set image "deployment/$SERVICE" "$SERVICE=$IMAGE:${{ github.sha }}"
          kubectl rollout status "deployment/$SERVICE" --timeout=300s
